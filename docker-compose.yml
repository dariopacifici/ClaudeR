version: '3.8'

services:
  clauder-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clauder-app
    ports: []  # No external ports - only accessible via Nginx
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/clauder.db
    volumes:
      - clauder-db:/app/data              # Database persistence
      - ./certs:/app/certs:ro             # SSL certificates (read-only)
    restart: unless-stopped
    networks:
      - clauder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/recipes"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy for HTTPS termination
  nginx:
    image: nginx:alpine
    container_name: clauder-nginx
    ports:
      - "85:443"      # HTTPS on port 85 (external)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - clauder-api
    restart: unless-stopped
    networks:
      - clauder-network

volumes:
  clauder-db:
    driver: local

networks:
  clauder-network:
    driver: bridge
